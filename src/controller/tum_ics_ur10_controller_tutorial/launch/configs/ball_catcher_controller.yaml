# Gains for the Proportional-Derivative Joint Space Controller
# P and D gains for each axis.
ball_catcher_controller: 
  jointspace:
    #proportional
    gains_p: [8.5, 8.5, 9.3, 5.5, 6.7, 2.6] # [8.5, 8.5, 9.3, 10.5, 12.7, 2.6]
    #derivative
    gains_d: [79, 79, 72, 32, 7, 25] # [79, 79, 72, 64, 11, 50]
    # Desired position
    goal: [0, -3.142, 1.578, -0.7854, 1.578, 0]         #goal: [0, -1.578, -1.578, 0, 1.578, 0] 
    # Desired duration
    duration: 10.0
  
  cartesianspace:
    #proportional
    gains_p: [30, 30, 30, 7.2, 7.2, 7.2]                        # [50, 50, 50, 20, 10, 5]
    #derivative
    gains_d: [120, 100, 100, 7.2, 7.2, 7.2]                     # [100, 75, 75, 73, 15, 5] whats up with q5
    #integral part
    gains_i: [30, 30, 30, 10, 10, 10]

